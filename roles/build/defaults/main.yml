# Build configuration
kaia_build_docker_base_image: "kaiachain/build_base:latest"
kaia_build_docker_builder_image: "kaia_builder"
kaia_build_remote_git_url: "https://github.com/kaiachain/kaia.git"
kaia_build_remote_git_branch: "dev"
kaia_build_check_file_path: "{{ cache_dir }}/kaia_build_check_file"
kaia_build_skip_if_exists: True
kaia_build_force_compile: False
kaia_build_cache: ""  # gs:// folder of builds by kaia commit to download instead of building (optional)

